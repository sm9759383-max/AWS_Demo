<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS Demo App</title>

<link rel="stylesheet" href="style.css">

</head> <body>
<header>
    <h1>AWS Demo App</h1>
    <p>Simple HTML, CSS and JavaScript application</p>
</header>

<main class="container">

    <section class="card">
        <h2>Welcome 👋</h2>

        <p id="message">
            Click the button to interact with the application.
        </p>

        <button id="welcomeBtn">
            Click Me
        </button>
    </section>

    <section class="card">
        <h2>Simple Counter</h2>

        <div class="counter">
            <button id="decreaseBtn">−</button>

            <span id="counterValue">0</span>

            <button id="increaseBtn">+</button>
        </div>
    </section>

    <section class="card">
        <h2>Choose a Color</h2>

        <div class="color-buttons">
            <button class="color-btn blue" data-color="#2563eb">
                Blue
            </button>

            <button class="color-btn green" data-color="#16a34a">
                Green
            </button>

            <button class="color-btn purple" data-color="#9333ea">
                Purple
            </button>

            <button class="color-btn orange" data-color="#ea580c">
                Orange
            </button>
        </div>
    </section>

    <section class="card">
        <h2>Current Date & Time</h2>

        <p id="dateTime"></p>
    </section>

</main>

<footer>
    <p>Deployed on AWS 🚀</p>
</footer>

<script src="script.js"></script>

</body> </html>
